name: Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: false

      - name: Analyze code
        run: flutter analyze
        continue-on-error: false

      - name: Run tests with coverage (zenrouter)
        run: flutter test --coverage
        working-directory: packages/zenrouter
        continue-on-error: false

      - name: Run tests with coverage (zenrouter_core)
        run: flutter test --coverage
        working-directory: packages/zenrouter_core
        continue-on-error: false

      - name: Run tests with coverage (zenrouter_file_generator)
        run: flutter test --coverage
        working-directory: packages/zenrouter_file_generator
        continue-on-error: false

      - name: Prefix coverage paths for the monorepo
        run: |
          for pair in \
            "packages/zenrouter/coverage/lcov.info:packages/zenrouter/" \
            "packages/zenrouter_core/coverage/lcov.info:packages/zenrouter_core/"
          do
            file="${pair%%:*}"
            prefix="${pair#*:}"
            if [ -f "$file" ]; then
              sed -i "s|^SF:lib/|SF:${prefix}lib/|" "$file"
            fi
          done

      - name: Upload coverage to Codecov (zenrouter)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/zenrouter/coverage/lcov.info
          flags: zenrouter
          name: zenrouter
          disable_search: true
          fail_ci_if_error: true

      - name: Upload coverage to Codecov (zenrouter_core)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/zenrouter_core/coverage/lcov.info
          flags: zenrouter_core
          name: zenrouter_core
          disable_search: true
          fail_ci_if_error: true