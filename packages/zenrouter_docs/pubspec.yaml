name: zenrouter_docs
description: A guided technical book for learning ZenRouter 3.
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Platform-agnostic UI foundation
  forui: ^0.25.0
  
  # ZenRouter ecosystem
  zenrouter:
  zenrouter_file_annotation:
  
  # Syntax highlighting for code examples
  syntax_highlight: ^0.5.0
  
  # URL launcher for external links
  url_launcher: ^6.2.0
  
  # Markdown rendering for documentation
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0

  # SEO for web
  meta_seo: ^3.0.9
  dynamic_path_url_strategy: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.13
  zenrouter_file_generator:
  
  # Icon and favicon generation
  icons_launcher: ^3.0.3

flutter:
  assets:
    - assets/logo_dark.png
    - assets/logo_light.png
    - assets/content/

icons_launcher:
  image_path: "assets/logo_light.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
      image_path: "assets/logo_light.png"
      favicon_path: "assets/logo_light.png"
